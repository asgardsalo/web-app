<VirtualHost *:8081>
    ServerName 0.0.0.0
    

    WSGIDaemonProcess webapp threads=5
    WSGIScriptAlias / /app/webapp.wsgi

    <Directory /app>
        Require all granted
    </Directory>

    Alias /static /app/static
    <Directory /app/static/>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>